<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>clipper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='3' width='14' height='26' rx='3' fill='%23F5C400'/%3E%3Cpath d='M14 12l6 4-6 4z' fill='%23111'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="clipper home">
      <span class="logo" aria-hidden="true"></span>clipper
    </a>
    <nav>
      <a href="#/" data-nav="home">Library</a>
    </nav>
    <div id="jobs-pill" class="jobs-pill" hidden></div>
    <button id="creators-btn" class="btn ghost phone-btn" type="button">Creators</button>
    <button id="accounts-btn" class="btn ghost phone-btn" type="button">Accounts</button>
    <button id="phone-btn" class="btn ghost phone-btn" type="button">Phone</button>
  </header>
  <dialog id="accounts-dialog" class="dialog" aria-labelledby="accounts-title">
    <h2 id="accounts-title">Accounts for publishing</h2>
    <div id="accounts-body"></div>
    <form method="dialog"><button class="btn">Close</button></form>
  </dialog>
  <dialog id="creators-dialog" class="dialog wide" aria-labelledby="creators-title">
    <h2 id="creators-title">Creators you clip for</h2>
    <div id="creators-body"></div>
    <form method="dialog"><button class="btn">Close</button></form>
  </dialog>
  <dialog id="phone-dialog" class="dialog" aria-labelledby="phone-title">
    <h2 id="phone-title">Open clipper on your phone</h2>
    <div id="phone-body"></div>
    <form method="dialog"><button class="btn">Close</button></form>
  </dialog>
  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
